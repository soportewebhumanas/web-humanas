server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 50M;

    # Archivos subidos. En la base se guardan rutas tipo "public/eventos/imagenes/x.jpg".
    # /files/public/...    -> usado por el código portado (reemplaza /humanasAdmin/storage/app/)
    # /storage/public/...  -> usado por la versión "main" del sitio ('/storage/' . $ruta)
    # Solo se expone storage/app/public, no todo storage/app.
    location ^~ /files/public/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }
    location ^~ /storage/public/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
